[package]
name = "smc-archiver"
version = "1.2.0"
edition = "2021"
description = "SMC (.smc) Smart Multi-core Container - Ultra-fast custom archiver with GUI (.smc / .zip / .7z)"

[[bin]]
name = "smc"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
rfd = "0.15"
rayon = "1.10"
lz4_flex = "0.11"
zstd = "0.13"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "aes-crypto", "zstd", "lzma", "xz", "ppmd"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "ppmd", "deflate", "zstd", "lz4", "util"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.52"
anyhow = "1.0"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "aes256", "util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
